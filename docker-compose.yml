services:
  postgres:
    image: postgres:16-alpine
    container_name: grand-line-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grandline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grandline_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-grand_line_hub}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - grand_line_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-grandline} -d ${POSTGRES_DB:-grand_line_hub}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grand_line_postgres_data:
