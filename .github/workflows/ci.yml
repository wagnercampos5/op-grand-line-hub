name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grandline
          POSTGRES_PASSWORD: grandline_dev_password
          POSTGRES_DB: grand_line_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U grandline -d grand_line_hub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://grandline:grandline_dev_password@localhost:5432/grand_line_hub?schema=public
      JWT_SECRET: grand-line-hub-ci-secret-minimum-32-characters-long
      JWT_EXPIRES_IN: 1d
      BCRYPT_SALT_ROUNDS: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Run database migrations
        run: pnpm --filter api prisma:deploy

      - name: Run lint
        run: pnpm lint

      - name: Run API tests
        run: pnpm api:test

      - name: Run Web tests
        run: pnpm web:test

      - name: Build API
        run: pnpm api:build

      - name: Build Web
        run: pnpm web:build
